[workspace]
resolver = "2"
members = ["crates/safai-core", "crates/safai-rules", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Safai"]
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
crossbeam-deque = "0.8"
num_cpus = "1"
globset = "0.4"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
