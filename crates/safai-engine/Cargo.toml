[package]
name = "safai-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared Safai scan/delete execution cores (Tauri + CLI)"

[dependencies]
safai-rules = { path = "../safai-rules" }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
trash = "5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }
