[package]
name = "safai-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Safai fast filesystem scanner core (extracted from wiztree-metafile)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde-metafile = { git = "https://github.com/ahaoboy/serde-metafile", version = "0.1", features = ["rkyv"] }
thiserror = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = "0.5"
crossbeam-deque = { workspace = true }
num_cpus = { workspace = true }
globset = { workspace = true }
rkyv = "0.8"
humansize = "2.1.3"

[dev-dependencies]
tempfile = "3"
