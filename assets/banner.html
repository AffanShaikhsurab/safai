<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Safai banner</title>
    <!--
      SOURCE for assets/safai-banner.png. Rendered headlessly at 2x:
        npm run assets:banner

      Everything is drawn from primitives — no webfonts, no external images.
      That matters because this gets rendered in a headless browser with no
      guarantee a font request resolves; a silent fallback to Courier would ship
      a broken banner. The SAFAI wordmark is therefore built from a hand-authored
      5x7 pixel bitmap, which also puts it in exactly the same visual language as
      the app's canvas sky.

      The starfield uses a seeded PRNG so the committed PNG is reproducible: a
      re-render produces a byte-identical sky rather than a random one, which
      keeps asset diffs meaningful.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 440px;
        overflow: hidden;
        background: #01030a;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 440px;
        overflow: hidden;
        /* Same navy ramp as the app: darkest at the top, never pure black. */
        background:
          radial-gradient(
            ellipse 70% 60% at 12% 108%,
            rgba(40, 74, 150, 0.28) 0%,
            transparent 62%
          ),
          radial-gradient(
            ellipse 55% 45% at 88% -10%,
            rgba(44, 74, 145, 0.16) 0%,
            transparent 58%
          ),
          linear-gradient(180deg, #04061a 0%, #0a1132 44%, #15245a 100%);
        font-family:
          "Segoe UI", -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
      }
      /* Every layer is absolutely positioned; JS paints stars, comet and ridge. */
      .layer {
        position: absolute;
        inset: 0;
      }
      .px {
        position: absolute;
      }

      #content {
        position: absolute;
        left: 82px;
        top: 118px;
        z-index: 5;
      }
      /* Pixel wordmark: one <i> per lit bitmap cell. */
      #mark {
        position: relative;
        height: 70px;
        margin-bottom: 26px;
      }
      #mark i {
        position: absolute;
        background: #f4f8ff;
      }
      .tagline {
        font-size: 25px;
        font-weight: 600;
        letter-spacing: -0.3px;
        color: #dce7ff;
        margin-bottom: 13px;
      }
      .sub {
        font-size: 15.5px;
        line-height: 1.65;
        color: rgba(196, 214, 252, 0.62);
        max-width: 620px;
      }
      .sub b {
        color: #9ec5ff;
        font-weight: 600;
      }
      /* Small caps strip of what it actually is. */
      .chips {
        display: flex;
        gap: 8px;
        margin-top: 24px;
      }
      .chip {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: rgba(190, 212, 255, 0.66);
        border: 1px solid rgba(130, 170, 240, 0.26);
        padding: 6px 11px;
      }
      /* Vignette keeps the right edge from competing with the text. */
      #vignette {
        z-index: 4;
        background: radial-gradient(
          ellipse 62% 100% at 22% 50%,
          rgba(1, 3, 10, 0.72) 0%,
          transparent 70%
        );
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="layer" id="stars"></div>
      <div class="layer" id="comet"></div>
      <div class="layer" id="ridge"></div>
      <div class="layer" id="vignette"></div>

      <div id="content">
        <div id="mark" aria-label="SAFAI"></div>
        <div class="tagline">Reclaim your disk. Safely.</div>
        <div class="sub">
          Finds the caches, build output and junk your dev tools quietly pile up
          — and tells you what's safe to delete. Written in Rust:
          <b>5.3M files in 19 seconds</b>.
        </div>
        <div class="chips">
          <span class="chip">Windows</span>
          <span class="chip">Rust + Tauri</span>
          <span class="chip">Recycle Bin by default</span>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      /* Deterministic PRNG (mulberry32) so the committed PNG is reproducible.
         A random starfield would make every re-render a meaningless diff. */
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const W = 1280;
      const H = 440;
      const rand = rng(20260725);

      // ---- starfield -------------------------------------------------------
      // pow(r, 2.6) gives many faint pinpoints and a few bright ones. A flat
      // random() reads as evenly grey noise rather than a sky.
      const stars = document.getElementById("stars");
      let html = "";
      for (let i = 0; i < 190; i++) {
        const b = Math.pow(rand(), 2.6);
        const big = b > 0.86;
        const size = big ? 3 : 2;
        const alpha = (0.16 + b * 0.8).toFixed(2);
        const x = Math.round(rand() * W);
        const y = Math.round(rand() * (H * 0.86));
        const tint = big ? "255,253,255" : "220,232,255";
        html +=
          `<i class="px" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;` +
          `background:rgba(${tint},${alpha})"></i>`;
      }
      stars.innerHTML = html;

      // ---- comet -----------------------------------------------------------
      // Head low-left of centre-right, trail climbing to the top-right, with a
      // steep opacity falloff so the light stays at the head.
      const comet = document.getElementById("comet");
      const headX = 905;
      const headY = 232;
      const step = 7;
      let ch = "";
      for (let i = 22; i >= 1; i--) {
        const a = 0.5 * Math.pow(1 - i / 23, 1.9);
        if (a < 0.015) continue;
        const s = i > 14 ? 2 : 3;
        ch +=
          `<i class="px" style="left:${headX + i * step}px;top:${headY - i * step}px;` +
          `width:${s}px;height:${s}px;background:rgba(214,232,255,${a.toFixed(3)})"></i>`;
      }
      // Plus-shaped halo, then a hard white core.
      for (const [dx, dy] of [
        [-4, 0],
        [4, 0],
        [0, -4],
        [0, 4],
      ]) {
        ch +=
          `<i class="px" style="left:${headX + dx}px;top:${headY + dy}px;width:4px;height:4px;` +
          `background:rgba(226,240,255,0.42)"></i>`;
      }
      ch += `<i class="px" style="left:${headX}px;top:${headY}px;width:5px;height:5px;background:#fff"></i>`;
      comet.innerHTML = ch;

      // ---- horizon ridge ---------------------------------------------------
      // Deterministic sin jitter, matching PixelSky's ridge so the banner and
      // the app agree on the same silhouette.
      const ridge = document.getElementById("ridge");
      const base = Math.round(H * 0.855);
      let rh = "";
      for (let x = 0; x < W; x += 2) {
        const j = Math.round(
          Math.sin(x * 0.055) * 5 + Math.sin(x * 0.017) * 8 + Math.sin(x * 0.004) * 5,
        );
        const top = base + j;
        rh += `<i class="px" style="left:${x}px;top:${top}px;width:2px;height:${H - top}px;background:#050c0c"></i>`;
      }
      rh +=
        `<i class="px" style="left:0;top:${base - 18}px;width:${W}px;height:64px;` +
        `background:linear-gradient(180deg, rgba(24,58,44,0.42), rgba(3,8,8,0))"></i>`;
      ridge.innerHTML = rh;

      // ---- SAFAI wordmark --------------------------------------------------
      // Hand-authored 5x7 bitmaps. Drawn as blocks rather than set in a webfont
      // so the render can never silently fall back to a wrong typeface.
      const GLYPHS = {
        S: ["01110", "10001", "10000", "01110", "00001", "10001", "01110"],
        A: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
        F: ["11111", "10000", "10000", "11110", "10000", "10000", "10000"],
        I: ["11111", "00100", "00100", "00100", "00100", "00100", "11111"],
      };
      const CELL = 10; // px per bitmap cell
      const GAP = 2; // px between cells, so the grid stays visible
      const TRACK = 14; // px between glyphs
      const mark = document.getElementById("mark");
      let mh = "";
      let penX = 0;
      for (const ch2 of "SAFAI") {
        const g = GLYPHS[ch2];
        for (let row = 0; row < g.length; row++) {
          for (let col = 0; col < g[row].length; col++) {
            if (g[row][col] !== "1") continue;
            mh +=
              `<i style="left:${penX + col * CELL}px;top:${row * CELL}px;` +
              `width:${CELL - GAP}px;height:${CELL - GAP}px"></i>`;
          }
        }
        penX += 5 * CELL + TRACK;
      }
      mark.innerHTML = mh;
      mark.style.width = penX - TRACK + "px";

      // Signals to the screenshot driver that painting is finished.
      document.documentElement.setAttribute("data-ready", "1");
    </script>
  </body>
</html>
