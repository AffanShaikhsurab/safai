<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Safai logo</title>
    <!--
      SOURCE for assets/safai-logo.png and for the app/installer icon master.
      Rendered headlessly at 2x:

        npm run assets:logo    ->  512x512  (README)
        npm run assets:icon    -> 1024x1024 (master for `tauri icon`)

      Sized from the viewport rather than fixed pixels, so the render script's
      --window-size is the single source of truth for output size and one file
      serves both jobs.

      `image-rendering: pixelated` keeps the 4-unit pixel grid hard-edged when
      the SVG scales up. Without it the browser smooth-scales and the whole point
      of drawing on a grid is lost — at icon sizes that reads as a blurry smudge.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #01030a;
      }
      img {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <img src="./safai-logo.svg" alt="Safai" />
  </body>
</html>
