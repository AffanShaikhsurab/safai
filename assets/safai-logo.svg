<?xml version="1.0" encoding="UTF-8"?>
<!--
  Safai logo — a single falling comet over a night sky.

  Deliberately minimal: one comet, seven stars, nothing else. Everything is drawn
  on a 4-unit pixel grid with square corners, so it reads as the same pixel-art
  language as the app's canvas sky and scales to a 16px favicon without turning
  to mush.

  Palette: near-black at the edges, deep blue toward the centre. No gradients on
  the comet itself — the trail tapers in discrete opacity steps, which is what
  keeps it looking drawn rather than blurred.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="512"
  height="512"
  role="img"
  aria-label="Safai"
  shape-rendering="crispEdges"
>
  <defs>
    <!-- Blue core fading to black at the corners. -->
    <radialGradient id="sky" cx="42%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#16294f" />
      <stop offset="55%" stop-color="#0a1230" />
      <stop offset="100%" stop-color="#02040b" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" fill="url(#sky)" />

  <!-- Starfield: mostly dim, two brighter. Square pixels, never round. -->
  <g fill="#dbe6ff">
    <rect x="8" y="12" width="2" height="2" opacity="0.55" />
    <rect x="14" y="26" width="2" height="2" opacity="0.28" />
    <rect x="10" y="46" width="2" height="2" opacity="0.38" />
    <rect x="30" y="10" width="2" height="2" opacity="0.22" />
    <rect x="44" y="50" width="2" height="2" opacity="0.32" />
    <rect x="52" y="20" width="2" height="2" opacity="0.2" />
    <rect x="36" y="56" width="2" height="2" opacity="0.24" />
  </g>

  <!--
    The comet. Head low-left, trail climbing to the top-right corner, matching
    the reference photograph's direction. Opacity falls off steeply so the light
    stays concentrated at the head; a linear fade reads as a laser pointer.
  -->
  <g fill="#cfe2ff">
    <rect x="48" y="10" width="2" height="2" opacity="0.07" />
    <rect x="44" y="14" width="2" height="2" opacity="0.11" />
    <rect x="40" y="18" width="2" height="2" opacity="0.16" />
    <rect x="36" y="22" width="3" height="3" opacity="0.23" />
    <rect x="32" y="26" width="3" height="3" opacity="0.33" />
    <rect x="28" y="30" width="3" height="3" opacity="0.46" />
    <rect x="24" y="34" width="4" height="4" opacity="0.62" />
  </g>

  <!-- Head: a soft plus-shaped halo, then a hard white core on top. -->
  <g fill="#a9c9ff" opacity="0.4">
    <rect x="16" y="42" width="4" height="4" />
    <rect x="24" y="42" width="4" height="4" />
    <rect x="20" y="38" width="4" height="4" />
    <rect x="20" y="46" width="4" height="4" />
  </g>
  <rect x="20" y="42" width="4" height="4" fill="#ffffff" />

  <!-- Hairline frame so the mark holds an edge on light backgrounds. -->
  <rect
    x="0.5"
    y="0.5"
    width="63"
    height="63"
    fill="none"
    stroke="#8cb0f0"
    stroke-opacity="0.2"
  />
</svg>
